<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Orbis Square">
  <!-- Favicon cut of the mark: solid accent ground, and heavier rules than the
       primary lockup (4 vs 2, dot r7.5 vs r5.5) so the orbit and the part still
       read once the whole thing is 16px wide. -->
  <rect width="64" height="64" fill="#ec3013"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="32" cy="14" r="7.5" fill="#fff"/>
</svg>
